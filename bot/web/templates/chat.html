<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Uzhalissa — локальный чат-бот</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --me:#2563eb; --bot:#334155; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg);
           color:#e2e8f0; display:flex; flex-direction:column; height:100vh; }
    header { padding:.8rem 1rem; background:var(--panel); display:flex;
             justify-content:space-between; align-items:center; }
    header small { color:#94a3b8; }
    main { flex:1; overflow-y:auto; padding:1rem; display:flex;
           flex-direction:column; gap:.6rem; max-width:760px; width:100%; margin:0 auto; }
    .msg { max-width:80%; padding:.6rem .9rem; border-radius:14px; white-space:pre-wrap; }
    .user { align-self:flex-end; background:var(--me); }
    .assistant { align-self:flex-start; background:var(--bot); }
    form { display:flex; gap:.5rem; padding:1rem; background:var(--panel);
           max-width:760px; width:100%; margin:0 auto; }
    input { flex:1; padding:.7rem 1rem; border-radius:10px; border:none;
            background:#0f172a; color:#e2e8f0; font-size:1rem; }
    button { padding:.7rem 1.4rem; border:none; border-radius:10px;
             background:var(--me); color:white; font-size:1rem; cursor:pointer; }
    .empty { text-align:center; color:#64748b; margin-top:3rem; }
  </style>
</head>
<body>
  <header>
    <b>💬 Uzhalissa Chat</b>
    <small>модель: {{ model_name }}</small>
    <a href="/chat" style="color:#93c5fd; text-decoration:none; font-size:.9rem;">версия со стримингом →</a>
  </header>

  <main>
    {% if not messages %}
      <div class="empty">Начните диалог — напишите сообщение ниже.</div>
    {% endif %}
    {% for m in messages %}
      <div class="msg {{ m.role.value }}">{{ m.content }}</div>
    {% endfor %}
  </main>

  <form method="post" action="/send">
    <input name="message" placeholder="Ваше сообщение…" autocomplete="off" required autofocus>
    <button type="submit">Отправить</button>
  </form>

  <script>/* прокрутка вниз */ document.querySelector('main').scrollTop = 1e9;</script>
</body>
</html>
