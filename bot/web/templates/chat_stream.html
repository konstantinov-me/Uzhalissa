<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Uzhalissa — чат со стримингом</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --me:#2563eb; --bot:#334155; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg);
           color:#e2e8f0; display:flex; flex-direction:column; height:100vh; }
    header { padding:.8rem 1rem; background:var(--panel); display:flex;
             justify-content:space-between; align-items:center; gap:1rem; }
    header small { color:#94a3b8; }
    header a { color:#93c5fd; text-decoration:none; font-size:.9rem; }
    main { flex:1; overflow-y:auto; padding:1rem; display:flex;
           flex-direction:column; gap:.6rem; max-width:760px; width:100%; margin:0 auto; }
    .msg { max-width:80%; padding:.6rem .9rem; border-radius:14px; white-space:pre-wrap; }
    .user { align-self:flex-end; background:var(--me); }
    .assistant { align-self:flex-start; background:var(--bot); }
    .pending { opacity:.6; font-style:italic; }
    form { display:flex; gap:.5rem; padding:1rem; background:var(--panel);
           max-width:760px; width:100%; margin:0 auto; }
    input { flex:1; padding:.7rem 1rem; border-radius:10px; border:none;
            background:#0f172a; color:#e2e8f0; font-size:1rem; }
    button { padding:.7rem 1.4rem; border:none; border-radius:10px;
             background:var(--me); color:white; font-size:1rem; cursor:pointer; }
    button:disabled { opacity:.5; cursor:wait; }
    .empty { text-align:center; color:#64748b; margin-top:3rem; }
  </style>
</head>
<body>
  <header>
    <b>💬 Uzhalissa Chat (стриминг)</b>
    <small>модель: {{ model_name }}</small>
    <a href="/">классическая версия →</a>
  </header>

  <main id="log"><div class="empty" id="hint">Ответы модели приходят частями (SSE).</div></main>

  <form id="f">
    <input id="text" autocomplete="off" placeholder="Напишите сообщение…" required>
    <button id="btn" type="submit">Отправить</button>
  </form>

  <script>
    let chatId = null;
    const log = document.getElementById('log');
    const form = document.getElementById('f');
    const input = document.getElementById('text');
    const btn = document.getElementById('btn');

    function add(role, content) {
      const hint = document.getElementById('hint');
      if (hint) hint.remove();
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = content;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      add('user', message);
      input.value = '';
      btn.disabled = true;

      const botDiv = add('assistant', '…');
      botDiv.classList.add('pending');
      let got = '';

      try {
        const resp = await fetch('/api/v1/chat/stream', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message, chat_id: chatId}),
        });
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        while (true) {
          const {done, value} = await reader.read();
          if (done) break;
          buf += decoder.decode(value, {stream: true});
          // разбор кадров SSE: "event: X\ndata: Y\n\n"
          let idx;
          while ((idx = buf.indexOf('\n\n')) !== -1) {
            const frame = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            let ev = 'message', data = '';
            for (const line of frame.split('\n')) {
              if (line.startsWith('event: ')) ev = line.slice(7).trim();
              else if (line.startsWith('data: ')) data += line.slice(6);
            }
            if (ev === 'meta') chatId = data;
            else if (ev === 'delta') {
              got += data.replace(/\\n/g, '\n');
              botDiv.textContent = got;
              log.scrollTop = log.scrollHeight;
            } else if (ev === 'done') {
              botDiv.textContent = got || '(пустой ответ)';
            }
          }
        }
      } catch (err) {
        botDiv.textContent = 'Ошибка: ' + err;
      } finally {
        botDiv.classList.remove('pending');
        btn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
